<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mess Pass</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: #f1f0f0;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    /* ---------- TOP BAR ---------- */
    .appbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #333333;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .appbar span {
      position: absolute;
      right: 14px;
      font-size: 20px;
      cursor: pointer;
    }

    /* ---------- MAIN CONTENT AREA ---------- */
    .page-wrapper {
      width: 100%;
      max-width: 420px;
      margin-top: 48px;
      padding: 14px 12px 24px 12px;
      display: flex;
      justify-content: center;
    }

    /* ---------- FLOATING CARD CONTAINER ---------- */
    .card-container {
      position: relative;
      width: 100%;
    }

    /* ---------- BADGE COUNTER ---------- */
    .counter {
      position: absolute;
      top: -8px;
      right: -6px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #999999;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      border: 2px solid #d8d8d8;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
      z-index: 10;
    }

    /* ---------- CARD ---------- */
    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #c2c2c2;
      padding: 14px 14px 14px 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    /* ---------- TWO-COLUMN PASS HEADER ---------- */
    .pass-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
      margin-top: 22px;
    }

    .pass-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /*-----------------QRBOX/IMAGE BOX--------------------------*/
    .card-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 5px 8px rgba(0, 0, 0, 0.35);
      border: 1px solid #333333;
      padding: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cardd-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 3px;
      box-shadow: 0 5px 8px rgba(0, 0, 0, 0.35);
      border: 1px solid #333333;
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-sq {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1px;
    }

    .qr-sq {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 1px;
    }

    .col-info {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .info-bold {
      font-family: 'Lucida Sans';
      font-size: 15px;
      font-weight: 600;
      color: #000000;
      line-height: 1.25;
      text-shadow: 1px 0px 0px #b0b0b0,
        1px 0px 0px #999999,
        1px 1px 1px rgba(0, 0, 0, 0.15);
    }

    /* ---------- COURSE & MESS INFO ---------- */
    .course-info {
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      margin: 27px 4px 8px 4px;
      color: #111111;
      line-height: 1.3;
    }

    .assigned-mess {
      text-align: center;
      font-size: 16.5px;
      font-weight: 500;
      margin: 25px 0 12px 0;
      color: #111111;
    }

    /* ---------- DATE TIME ---------- */
    .datetime {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 37px 40px 8px 12px;
      padding: 0 4px;
      font-size: 20px;
      font-weight: 600;
      color: #000000;
    }

    /* ---------- APPROVED TEXT ---------- */
    .approved-text {
      font-family: 'Leelawadee UI';
      text-align: center;
      font-size: 23px;
      font-weight: 900;
      color: #34d35b;
      margin: 35px 0 4px 0;
      letter-spacing: 0.3px;
    }

    /* ---------- RATE US BUTTON ---------- */
    .rate-us-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px 0 10px 0;
    }

    .rate-us-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border: 2.4px solid #9e0c0c;
      border-radius: 8px;
      padding: 1px 4px;
      gap: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      text-decoration: none;
    }

    .star-icon {
      color: #ddbe55;
      font-size: 15px;
      line-height: 1;
    }

    .rate-us-text {
      color: #1a1919;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    /* ---------- SCAN BOX ---------- */
    .scan-box {
      width: 100%;
      height: 390px;
      border: 17px solid #2E7D32;
      background: #ffffff;
      margin-top: 2px;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .scan-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ---------- COLOR PICKER ---------- */
    .color-picker {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }

    .color-picker:hover {
      opacity: 1;
    }

    .color-picker input {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* Prevent zoom on double tap */
    * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>

<body>

  <div class="appbar">
    Mess Pass
    <span id="closeBtn">✕</span>
  </div>

  <div class="page-wrapper">
    <div class="card-container">

      <!-- Overlapping Badge Circle -->
      <div class="counter" id="counter">29</div>

      <div class="card">
        <div class="pass-header-grid">
          <!-- Left Column: Photo & Student Details -->
          <div class="pass-col">
            <div class="card-box">
              <img class="avatar-sq" src="shivam1.png" alt="Profile Picture" id="profileImg">
            </div>
            <div class="col-info">
              <div class="info-bold">12309834</div>
              <div class="info-bold">Sachin Burnwal</div>
            </div>
          </div>

          <!-- Right Column: QR Code & Meal Details -->
          <div class="pass-col">
            <div class="cardd-box">
              <img class="qr-sq" src="qrrr.png" alt="QR Code">
            </div>
            <div class="col-info">
              <div class="info-bold" id="meal">Lunch</div>
              <div class="info-bold" id="messName">Mess-Centre-01</div>
            </div>
          </div>
        </div>

        <div class="course-info">
          P132-L:B.Tech. (Computer Science and Engineering)(2023)
        </div>

        <div class="assigned-mess">
          Your Assigned Mess - Mess-Centre-01
        </div>

        <div class="datetime">
          <div id="date"></div>
          <div id="time"></div>
        </div>

        <div class="approved-text">Meal Approved</div>

        <div class="rate-us-container">
          <div class="rate-us-btn">
            <span class="star-icon">★</span>
            <span class="rate-us-text">RATE US</span>
          </div>
        </div>

        <div class="scan-box" id="scanBox">
          <video class="scan-video" autoplay loop muted playsinline>
            <source src="GIF.mp4" type="video/mp4">
          </video>
        </div>

      </div>

    </div>
  </div>

  <div class="color-picker">
    <input type="color" id="colorPicker" value="#2E7D32">
  </div>

  <script>
    // Elements
    const counterEl = document.getElementById('counter');
    const dateEl = document.getElementById('date');
    const timeEl = document.getElementById('time');
    const mealEl = document.getElementById('meal');
    const colorPicker = document.getElementById('colorPicker');
    const scanBox = document.getElementById('scanBox');
    const closeBtn = document.getElementById('closeBtn');

    // Get selected meal from URL parameters or sessionStorage
    const urlParams = new URLSearchParams(window.location.search);
    const selectedMeal = urlParams.get('meal') || sessionStorage.getItem('selectedMeal') || 'Lunch';
    if (mealEl) {
      mealEl.textContent = selectedMeal;
    }

    // Update time and date
    function updateDateTime() {
      const now = new Date();

      // Format: Oct 10, 2025
      dateEl.textContent = now.toLocaleDateString('en-US', {
        month: 'short',
        day: '2-digit',
        year: 'numeric'
      });

      // Format: 12:55 PM
      timeEl.textContent = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
    }

    // Counter logic
    let count = 29;
    function updateCounter() {
      counterEl.textContent = count;
      count--;
      if (count < 0) count = 29;
    }

    // Color picker
    colorPicker.addEventListener('input', (e) => {
      scanBox.style.borderColor = e.target.value;
    });

    // Close button
    closeBtn.addEventListener('click', () => {
      if (confirm('Close Mess Pass?')) {
        window.location.href = 'index.html';
      }
    });

    // Initialize
    updateDateTime();
    updateCounter();

    // Update every second
    setInterval(updateDateTime, 1000);
    setInterval(updateCounter, 1000);

    // Prevent zoom
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // Load fallback if image not found
    const avatarImg = document.querySelector('.avatar-sq');
    if (avatarImg) {
      avatarImg.onerror = function () {
        this.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iOTYiIGhlaWdodD0iOTYiIHZpZXdCb3g9IjAgMCA5NiA5NiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iNDgiIGN5PSI0OCIgcj0iNDgiIGZpbGw9IiNFM0UzRTMiLz4KPHBhdGggZD0iTTQ4IDM0QzQxLjM3MjYgMzQgMzYgMzkuMzcyNiAzNicA0NkMzNiA1Mi42Mjc0IDQxLjM3MjYgNTggNDggNThDNTQuNjI3NCAzNCA2MCA1Mi42Mjc0IDYwIDQ2QzYwIDM5LjM3MjYgNTQuNjI3NCAzNCA0OCAzNFpNNDggNjJDMzguMDU5IDYyIDMwIDcwLjA1OSAzMCA4MEg2NkM2NeA3MC4wNTkgNTtuOTQxIDYyIDQ4IDYyWiIgZmlsbD0id2hpdGUiLz4KPC9zdmc+';
        this.alt = 'Profile Image';
      };
    }
  </script>

</body>

</html>
